# Public read-only face, exposed via Cloudflare Tunnel.
# Proxies ONLY /status, /api/status and the two stylesheets and scripts
# that page needs — the dashboard, its assets and the toggle endpoint
# are unreachable through this server block.

server {
    listen 80;
    server_name status.syamxm.com;

    location = /status {
        proxy_pass http://switchboard:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location = /api/status {
        proxy_pass http://switchboard:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location ~ ^/assets/(common|status)\.(css|js)$ {
        proxy_pass http://switchboard:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    location / {
        return 404;
    }
}
